name: Build & Release Executable

# Every push to main: test, give it the next version (v2.0.1 -> v2.0.2), build the exe and
# publish a GitHub release with it. Running tools see the release and offer the update.
# Other branches only run ci.yml (tests), so unfinished work never reaches users.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags + history for the version and the notes

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

      - name: Pick version
        id: ver
        run: python scripts/next_version.py >> $env:GITHUB_OUTPUT

      - name: Stamp version
        run: python scripts/set_version.py "${{ steps.ver.outputs.version }}"

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm --distpath dist --workpath build AKPhone_Dispatcher_Recovered.spec

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akphone-dispatcher-v${{ steps.ver.outputs.version }}
          path: dist/AKPhone_Dispatcher_Recovered.exe

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          # the bare exe is the whole install: it writes templates and settings on first run
          files: dist/AKPhone_Dispatcher_Recovered.exe
