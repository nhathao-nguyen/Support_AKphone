name: Build & Release Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --distpath dist --workpath build AKPhone_Dispatcher_Recovered.spec
          Copy-Item app_settings.json dist/ -Force
          Copy-Item template_script.txt dist/ -Force
          Copy-Item template_config.ini dist/ -Force
          if (Test-Path configs) { Copy-Item configs dist/configs -Recurse -Force }
          if (Test-Path assets) { Copy-Item assets dist/assets -Recurse -Force }

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path dist/* -DestinationPath akphone-dispatcher-windows.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: akphone-dispatcher-windows
          path: akphone-dispatcher-windows.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: akphone-dispatcher-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
